name: Tests

on:
  push:
    branches: [main]
    paths: ["game/**", "tools/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["game/**", "tools/**", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-${{ hashFiles('tools/env.sh') }}
      - name: Install Godot
        run: tools/setup_godot.sh
      - name: Run tests
        run: tools/test.sh
